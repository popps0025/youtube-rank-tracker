name: daily-rank-track

# 매일 01:30 UTC (한국시간 오전 10시 30분) 자동 실행
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}      # 수동 실행 버튼도 제공

permissions:
  contents: write            # 이력·대시보드를 저장소에 커밋

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect + build dashboard
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python run.py

      - name: Commit results
        run: |
          git config user.name "rank-bot"
          git config user.email "rank-bot@users.noreply.github.com"
          git add data/history.json data/dashboard.html
          git commit -m "chore: rank update $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
